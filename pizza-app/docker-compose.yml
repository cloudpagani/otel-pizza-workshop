# Pizza Order Tracker - workshop stack
#
# Compose reads variable values (DASH0_AUTH_TOKEN, DASH0_OTLP_GRPC_ENDPOINT,
# DASH0_DATASET, SLOW_KITCHEN, NO_DRIVERS, ...) from the `.env` file that sits
# NEXT TO THIS FILE, i.e. `pizza-app/.env`. Create it from inside pizza-app/:
#
#     cp .env.template .env
#
# An `.env` anywhere else (the repo root, for example) is NOT read.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.160.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otelcol.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    environment:
      - DASH0_OTLP_GRPC_ENDPOINT=${DASH0_OTLP_GRPC_ENDPOINT:?set DASH0_OTLP_GRPC_ENDPOINT in pizza-app/.env}
      - DASH0_AUTH_TOKEN=${DASH0_AUTH_TOKEN:?set DASH0_AUTH_TOKEN in pizza-app/.env}
      - DASH0_DATASET=${DASH0_DATASET:-default}
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "--version"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 5s

  order-service:
    build: ./order-service
    ports:
      - "3000:3000"
    environment:
      - KITCHEN_SERVICE_URL=http://kitchen-service:3001
      - DELIVERY_SERVICE_URL=http://delivery-service:3002
      - NODE_OPTIONS=--require @opentelemetry/auto-instrumentations-node/register
      - OTEL_SERVICE_NAME=order-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_NODE_DISABLED_INSTRUMENTATIONS=fs,net,dns
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=pizza-app,deployment.environment.name=${DASH0_ENVIRONMENT:-local},vcs.repository.url.full=https://github.com/cloudpagani/otel-pizza-workshop
    healthcheck:
      test:
        - CMD
        - env
        - NODE_OPTIONS=
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      kitchen-service:
        condition: service_healthy
      delivery-service:
        condition: service_healthy
      otel-collector:
        condition: service_started

  kitchen-service:
    build: ./kitchen-service
    ports:
      - "3001:3001"
    environment:
      - SLOW_KITCHEN=${SLOW_KITCHEN:-false}
      - NODE_OPTIONS=--require @opentelemetry/auto-instrumentations-node/register
      - OTEL_SERVICE_NAME=kitchen-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_NODE_DISABLED_INSTRUMENTATIONS=fs,net,dns
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=pizza-app,deployment.environment.name=${DASH0_ENVIRONMENT:-local},vcs.repository.url.full=https://github.com/cloudpagani/otel-pizza-workshop
    healthcheck:
      test:
        - CMD
        - env
        - NODE_OPTIONS=
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3001/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  delivery-service:
    build: ./delivery-service
    ports:
      - "3002:3002"
    environment:
      - NO_DRIVERS=${NO_DRIVERS:-false}
      - NODE_OPTIONS=--require @opentelemetry/auto-instrumentations-node/register
      - OTEL_SERVICE_NAME=delivery-service
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318
      - OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
      - OTEL_LOGS_EXPORTER=otlp
      - OTEL_NODE_DISABLED_INSTRUMENTATIONS=fs,net,dns
      - OTEL_RESOURCE_ATTRIBUTES=service.namespace=pizza-app,deployment.environment.name=${DASH0_ENVIRONMENT:-local},vcs.repository.url.full=https://github.com/cloudpagani/otel-pizza-workshop
    healthcheck:
      test:
        - CMD
        - env
        - NODE_OPTIONS=
        - node
        - -e
        - "require('http').get('http://127.0.0.1:3002/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    depends_on:
      otel-collector:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    environment:
      - DASH0_WEB_ENDPOINT=${DASH0_WEB_ENDPOINT:-}
      - DASH0_WEB_AUTH_TOKEN=${DASH0_WEB_AUTH_TOKEN:-local-collector}
      - DASH0_DATASET=${DASH0_DATASET:-default}
      - DASH0_ENVIRONMENT=${DASH0_ENVIRONMENT:-local}
    depends_on:
      order-service:
        condition: service_healthy
