receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
        cors:
          allowed_origins:
            - "*"
          allowed_headers:
            - "*"

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  resource_detection:
    detectors: [env, system]
    override: false
    system:
      resource_attributes:
        host.name:
          enabled: true
        os.type:
          enabled: true
  filter/drop_noise:
    error_mode: ignore
    traces:
      span:
        - 'attributes["url.path"] == "/health"'
        - 'IsMatch(name, ".*/health$")'
        - 'IsMatch(name, "^middleware - .*")'
  batch:
    send_batch_size: 1024
    timeout: 5s

exporters:
  otlp_grpc/dash0:
    endpoint: ${env:DASH0_OTLP_GRPC_ENDPOINT}
    headers:
      Authorization: "Bearer ${env:DASH0_AUTH_TOKEN}"
      Dash0-Dataset: "${env:DASH0_DATASET}"

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, filter/drop_noise, resource_detection, batch]
      exporters: [otlp_grpc/dash0]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/dash0]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource_detection, batch]
      exporters: [otlp_grpc/dash0]
  telemetry:
    logs:
      level: info
